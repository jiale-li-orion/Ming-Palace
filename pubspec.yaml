name: ming_palace
description: Ming Palace Ruins AR narrative demo — first-person on-site experience with Zhu Yunwen at Ming Palace Ruins, Nanjing.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  geolocator: ^14.0.3
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/content/experience.json
    - assets/content/route.json
    - assets/content/evidence-index.json
    - assets/content/script/
    - assets/audio/
    - assets/images/ai_v1/
    - assets/ui/
